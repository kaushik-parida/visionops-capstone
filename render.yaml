services:
  - type: web
    name: visionops-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && python download_models.py"
    startCommand: "cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
